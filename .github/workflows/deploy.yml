name: Publicar no Cloudflare Workers
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # só publica quando os secrets da Cloudflare estiverem configurados no repositório
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "Secrets CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID não configurados; build e testes ok, publicação pulada."
